name: Backend CI/CD Pipeline (Docker Hub & Azure App Service)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Quality Gate: TypeScript Compilation & Static Code Analysis
  # ============================================================================
  quality-gate:
    name: 🛡️ Code Quality & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript Compilation
        run: npm run build

      - name: Run Static Code Analysis (Lint)
        run: npm run lint

  # ============================================================================
  # 2. Containerization: Build & Push Images to Docker Hub
  # ============================================================================
  build-and-push-docker:
    name: 🐳 Docker Hub Build & Publish
    needs: quality-gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Architecture Emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx Builder
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata & Docker Tags (Backend API)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/creatifyx-backend
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata & Docker Tags (Nginx Reverse Proxy)
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/creatifyx-nginx
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build & Push Nginx Container Image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Continuous Deployment: Azure App Service (Web App for Containers)
  # ============================================================================
  deploy-to-azure:
    name: ☁️ Deploy to Azure App Service Web App
    needs: build-and-push-docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: '${{ secrets.DOCKERHUB_USERNAME }}/creatifyx-backend:${{ github.sha }}'

      - name: Verify Live Deployment Health Probe
        run: |
          echo "Verifying application health on Azure App Service..."
          APP_URL="https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
          echo "Target Health Endpoint: $APP_URL"
          
          # Retry loop with 15-second intervals (allow container pull & warm-up)
          MAX_RETRIES=12
          COUNT=0
          until [ $COUNT -ge $MAX_RETRIES ]
          do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL" || true)
            echo "Attempt $((COUNT+1))/$MAX_RETRIES: HTTP Status $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Deployment Successful! API is healthy and serving traffic."
              exit 0
            fi
            COUNT=$((COUNT+1))
            sleep 15
          done
          
          echo "⚠️ Health probe did not return 200 within expected timeout. Check Azure App Service streaming logs."
          exit 1
