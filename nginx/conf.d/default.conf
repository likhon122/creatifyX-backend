upstream backend_service {
    server backend:5000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum payload size for asset uploads (videos, high-res images, archives)
    client_max_body_size 100M;

    # --------------------------------------------------------------------------
    # Health Check Endpoint (Direct Probe Bypass for Azure App Service & Docker)
    # --------------------------------------------------------------------------
    location = /health {
        proxy_pass http://backend_service/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Authentication Rate Limiting (Mitigate Brute Force & Credential Stuffing)
    # --------------------------------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=auth_rate_limit burst=20 nodelay;
        limit_conn addr_conn_limit 20;

        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Main API Routing & Asset Upload Proxy
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=api_rate_limit burst=100 nodelay;
        limit_conn addr_conn_limit 50;

        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Upload & Process Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Extended timeouts for large video & media transfers
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
