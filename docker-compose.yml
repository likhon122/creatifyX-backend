services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: creatifyx-backend:latest
    container_name: creatifyx-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    expose:
      - "5000"
    ports:
      - "5000:5000"
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - creatify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: creatifyx-nginx:latest
    container_name: creatifyx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - creatify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  creatify-network:
    driver: bridge

volumes:
  backend-uploads:
