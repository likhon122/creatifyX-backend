# ==============================================================================
# Azure App Service Linux - Multi-Container (Docker Compose) Deployment Spec
# ==============================================================================
services:
  backend:
    image: ${DOCKERHUB_USERNAME}/creatifyx-backend:latest
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: ${DOCKERHUB_USERNAME}/creatifyx-nginx:latest
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
